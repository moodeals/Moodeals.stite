<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Add deal</title>
<style>
:root{--navy:#0b1b4d;--blue:#1f4bff;--yellow:#ffd23f;--bg:#f3f5fb;--muted:#55607f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font:16px/1.4 system-ui,-apple-system,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:16px;border-bottom:5px solid var(--yellow);font:900 1.3rem "Arial Black",Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
label{display:block;font-weight:700;margin:12px 0 4px}
input{width:100%;padding:13px;border:2px solid #cfd6ee;border-radius:10px;font-size:16px;background:#fff;color:var(--navy)}
button{font:800 1rem system-ui,sans-serif;padding:14px 18px;border:0;border-radius:10px;cursor:pointer}
.go{width:100%;margin-top:16px;background:var(--yellow);color:var(--navy);box-shadow:0 3px 0 #c9a200}
.alt{background:#e3e8fa;color:var(--navy);padding:10px 14px}
.res{background:#fff;border-radius:12px;padding:14px;margin-top:16px;display:none}
.res p{margin:6px 0;word-break:break-all}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.msg{margin-top:12px;font-weight:700}
.err{color:#c0102f}
details{margin-top:20px}
summary{font-weight:800;cursor:pointer}
.d{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #d9dff2}
.d span{flex:1;font-size:.92rem}
small{color:var(--muted)}
</style></head><body>
<header>Add a deal</header>
<main>
<div id="setup" style="display:none">
<p><b>One-time setup.</b> Paste your GitHub token once. It stays on this device only.</p>
<label for="tok">GitHub token</label><input id="tok" type="password" autocomplete="off">
<label for="repo">Repository (owner/name)</label><input id="repo" value="moodeals/Moodeals.stite">
<label for="site">Your site address</label><input id="site" value="https://moodeals.store">
<button class="go" id="save">Save</button>
</div>

<div id="app" style="display:none">
<label for="url">Amazon link</label><input id="url" inputmode="url" placeholder="https://amzn.to/...">
<label for="title">Deal title</label><input id="title" placeholder="Nivea Body Wash 3-Pack">
<label for="note">Short note (optional)</label><input id="note" placeholder="Clip the coupon on the page">
<label for="badge">Badge (optional)</label><input id="badge" placeholder="$10 OFF">
<label for="image">Image link (optional)</label><input id="image" inputmode="url">
<label for="code">Link code <small>(made for you, change if you like)</small></label><input id="code" autocapitalize="off">
<button class="go" id="add">Add deal</button>
<div class="msg" id="msg"></div>
<div class="res" id="res">
<p><b>Post this on HC / Twitter:</b></p><p id="goLink"></p>
<div class="row"><button class="alt" id="cpGo">Copy link</button><button class="alt" id="cpPost">Copy title + link</button></div>
<p><small>Deal page: <span id="pageLink"></span></small></p>
<p><small>Live in about a minute. Open the link once to check it lands on Amazon.</small></p>
</div>
<details><summary>Current deals</summary><div id="list"></div></details>
<p><button class="alt" id="reset">Change token or settings</button></p>
</div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const get = (k) => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } };
const put = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
let cfg = { tok: get("md_tok"), repo: get("md_repo") || "moodeals/Moodeals.stite", site: get("md_site") || "https://moodeals.store" };

const b64d = (s) => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), (c) => c.charCodeAt(0)));
const b64e = (s) => { const b = new TextEncoder().encode(s); let t = ""; b.forEach((x) => (t += String.fromCharCode(x))); return btoa(t); };
const api = (m, body) => fetch(`https://api.github.com/repos/${cfg.repo}/contents/deals.json`, {
  method: m || "GET",
  headers: { Authorization: "Bearer " + cfg.tok, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
  body: body ? JSON.stringify(body) : undefined
});
async function load() {
  const r = await api();
  if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? "GitHub rejected the token. Check it has Contents: Read and write for this repo." : r.status === 404 ? "Repository or deals.json not found. Check the repository name." : "GitHub error " + r.status);
  const j = await r.json();
  return { sha: j.sha, deals: JSON.parse(b64d(j.content)) };
}
const slug = (t) => (t.toLowerCase().replace(/[^a-z0-9]+/g, "").slice(0, 8) || "deal") + Math.random().toString(36).slice(2, 5);
const say = (t, bad) => { $("msg").textContent = t; $("msg").className = "msg" + (bad ? " err" : ""); };

function show() {
  const ok = !!cfg.tok;
  $("setup").style.display = ok ? "none" : "block";
  $("app").style.display = ok ? "block" : "none";
  if (ok) refresh();
}
async function refresh() {
  try {
    const { deals } = await load();
    $("list").innerHTML = deals.map((d) => `<div class="d"><span>${d.title.replace(/</g, "&lt;")}<br><small>/go/${d.code}</small></span><button class="alt" data-c="${d.code}">Remove</button></div>`).join("") || "<small>No deals yet.</small>";
  } catch (e) { say(e.message, true); }
}
$("save").onclick = () => {
  cfg = { tok: $("tok").value.trim(), repo: $("repo").value.trim(), site: $("site").value.trim().replace(/\/$/, "") };
  put("md_tok", cfg.tok); put("md_repo", cfg.repo); put("md_site", cfg.site); show();
};
$("reset").onclick = () => { put("md_tok", ""); cfg.tok = ""; show(); };
$("title").oninput = () => { if (!$("code").dataset.edited) $("code").value = $("title").value ? slug($("title").value) : ""; };
$("code").oninput = () => { $("code").dataset.edited = "1"; };

$("add").onclick = async () => {
  const url = $("url").value.trim(), title = $("title").value.trim();
  let code = $("code").value.trim().toLowerCase().replace(/[^a-z0-9]/g, "");
  if (!/^https?:\/\//.test(url)) return say("Paste the Amazon link first.", true);
  if (!title) return say("Add a title.", true);
  if (!code) code = slug(title);
  $("add").disabled = true; say("Adding…");
  try {
    const { sha, deals } = await load();
    if (deals.some((d) => d.code === code)) code += Math.random().toString(36).slice(2, 4);
    deals.unshift({ code, title, price: "", note: $("note").value.trim(), badge: $("badge").value.trim(), image: $("image").value.trim(), url });
    const r = await api("PUT", { message: "Add deal " + code, content: b64e(JSON.stringify(deals, null, 2) + "\n"), sha });
    if (!r.ok) throw new Error(r.status === 409 ? "Something changed at the same time. Tap Add deal again." : "Could not save (error " + r.status + ").");
    const go = `${cfg.site}/go/${code}`;
    $("goLink").textContent = go; $("pageLink").textContent = `${cfg.site}/${code}`;
    $("res").style.display = "block"; say("Added. Live in about a minute.");
    $("cpGo").onclick = () => navigator.clipboard.writeText(go);
    $("cpPost").onclick = () => navigator.clipboard.writeText(title + "\n" + go);
    ["url", "title", "note", "badge", "image", "code"].forEach((i) => { $(i).value = ""; delete $(i).dataset.edited; });
    refresh();
  } catch (e) { say(e.message, true); }
  $("add").disabled = false;
};
$("list").onclick = async (e) => {
  const c = e.target.dataset && e.target.dataset.c;
  if (!c || !confirm("Remove this deal? Its links will stop working.")) return;
  try {
    const { sha, deals } = await load();
    const next = deals.filter((d) => d.code !== c);
    const r = await api("PUT", { message: "Remove deal " + c, content: b64e(JSON.stringify(next, null, 2) + "\n"), sha });
    if (!r.ok) throw new Error("Could not remove (error " + r.status + ").");
    say("Removed. Updates in about a minute."); refresh();
  } catch (er) { say(er.message, true); }
};
show();
</script></body></html>
